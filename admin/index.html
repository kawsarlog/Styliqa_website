<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Admin | Styliqa</title>
<meta name="description" content="Styliqa journal admin.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://styliqa.studio/admin">
<meta name="theme-color" content="#1a1214">
<link rel="icon" href="/assets/img/logo.jpg" type="image/jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div id="loginView" class="admin-login">
  <div class="admin-card">
    <div class="row" style="margin-bottom:1.25rem">
      <div class="admin-card__icon" aria-hidden="true">◆</div>
      <div>
        <h1>Admin sign in</h1>
        <p class="muted" style="margin:0.2rem 0 0">Styliqa Journal dashboard</p>
      </div>
    </div>
    <div class="grid">
      <label class="field">Admin token
        <input id="tokenInput" type="password" placeholder="Paste your admin token" autocomplete="current-password">
      </label>
      <button type="button" class="btn btn--brand" id="loginBtn">Login</button>
    </div>
  </div>
</div>

<div id="dashView" class="admin-shell" hidden>
  <div class="admin-head">
    <div>
      <h1>Blog dashboard</h1>
      <p class="muted" style="margin:0.35rem 0 0">Write and publish Styliqa Journal posts.</p>
    </div>
    <button type="button" class="btn btn--ghost" id="logoutBtn">Logout</button>
  </div>

  <section id="formPanel" class="admin-panel" hidden>
    <div class="row" style="justify-content:space-between;margin-bottom:1rem">
      <div>
        <h2 id="formTitle">New post</h2>
        <p class="muted" style="margin:0.2rem 0 0"><span class="req">*</span> required to publish — everything else is optional.</p>
      </div>
      <button type="button" class="btn btn--ghost" id="cancelBtn">Cancel</button>
    </div>

    <div class="grid">
      <div class="grid-2">
        <label class="field">Title <span class="req">*</span>
          <input id="fTitle" type="text" placeholder="Post title">
        </label>
        <label class="field">Slug <span class="hint">(auto from title if empty)</span>
          <input id="fSlug" type="text" placeholder="tech-pack-vs-flat-sketch">
        </label>
      </div>

      <div class="grid-3">
        <label class="field">Category
          <input id="fCategory" type="text" list="categoryList" placeholder="Tech Packs">
          <datalist id="categoryList"></datalist>
        </label>
        <label class="field">Category slug
          <input id="fCategorySlug" type="text" placeholder="tech-packs">
        </label>
        <label class="field">Read time
          <input id="fReadTime" type="text" placeholder="4 min read">
        </label>
      </div>

      <div>
        <label class="field">Hero image <span class="req">*</span> <span class="hint">(to publish)</span>
          <input id="fHeroFile" type="file" accept="image/*">
        </label>
        <div id="heroPreview" class="hero-preview" hidden><img id="heroPreviewImg" alt=""></div>
        <label class="field" style="margin-top:0.75rem">Hero alt text
          <input id="fHeroAlt" type="text" placeholder="Describe the cover image">
        </label>
        <input id="fHeroUrl" type="hidden">
      </div>

      <label class="field">Excerpt
        <textarea id="fExcerpt" rows="2" placeholder="Short summary shown on the blog list"></textarea>
      </label>

      <div>
        <div class="field" style="margin-bottom:0.45rem">Content <span class="req">*</span> <span class="hint">(to publish)</span></div>
        <div id="editor"></div>
      </div>

      <div class="admin-panel" style="margin:0;padding:1rem;background:color-mix(in srgb, var(--paper) 70%, white)">
        <h2 style="font-size:1.05rem;margin-bottom:0.75rem">SEO</h2>
        <div class="grid">
          <label class="field">Meta title
            <input id="fMetaTitle" type="text" placeholder="Defaults to post title">
          </label>
          <label class="field">Meta description
            <textarea id="fMetaDesc" rows="2" placeholder="Shown in Google results (150–160 chars)"></textarea>
          </label>
          <label class="field">OG title
            <input id="fOgTitle" type="text" placeholder="Defaults to post title">
          </label>
          <label class="field">OG description
            <textarea id="fOgDesc" rows="2" placeholder="Defaults to meta description"></textarea>
          </label>
          <label class="field">OG image URL
            <input id="fOgImage" type="text" placeholder="Defaults to hero image">
          </label>
        </div>
      </div>

      <div class="row">
        <div class="status-toggle" role="group" aria-label="Post status">
          <button type="button" data-status="draft" class="is-active">Draft</button>
          <button type="button" data-status="published">Published</button>
        </div>
        <button type="button" class="btn btn--brand" id="saveBtn">Save draft</button>
      </div>
    </div>
  </section>

  <section class="admin-panel">
    <div class="row" style="justify-content:space-between">
      <div>
        <h2>Posts <span id="postCount">(0)</span></h2>
        <p class="muted" id="postStats" style="margin:0.2rem 0 0"></p>
      </div>
      <div class="row">
        <button type="button" class="btn btn--ghost" id="refreshBtn">Refresh</button>
        <button type="button" class="btn btn--brand" id="newBtn">New post</button>
      </div>
    </div>
    <div id="postsList"></div>
  </section>
</div>

<div id="toast" class="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
